<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FootballAI Admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-body">
    <header class="topbar">
      <div class="container nav">
        <div class="brand-wrap">
          <div class="brand-badge">FA</div>
          <div>
            <div class="brand">FootballAI Admin</div>
            <small>Manual payment approvals</small>
          </div>
        </div>
        <nav>
          <a href="/">Customer site</a>
          <button id="logoutAdminBtn" class="secondary">Log out</button>
        </nav>
      </div>
    </header>

    <main class="container admin-shell">
      <section id="adminSummary" class="admin-summary card"></section>

      <section class="card section-block">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">Settings</p>
            <h2>Pricing controls</h2>
          </div>
        </div>

        <form id="pricingForm" class="stacked-form">
          <div class="inline-grid">
            <label>
              Registration fee (GHS)
              <input name="registrationFee" type="number" min="1" step="0.01" required />
            </label>
            <label>
              Custom conversion (GHS per credit)
              <input name="customGhsPerCredit" type="number" min="0.01" step="0.01" required />
            </label>
          </div>

          <h3>Packages</h3>
          <div id="packagesEditor" class="editor-list"></div>

          <h3>Analysis costs</h3>
          <div id="analysisEditor" class="editor-list"></div>

          <button class="primary" type="submit">Save pricing</button>
        </form>
      </section>

      <section class="card section-block">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">Users</p>
            <h2>Accounts</h2>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Credits</th>
                <th>Adjust</th>
              </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card section-block">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">Approvals</p>
            <h2>Payment queue</h2>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>User</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Reference</th>
                <th>Proof</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="paymentsTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/admin.js"></script>
  </body>
</html>
